<div class="crop-page-container">
  <!-- Upload & Detection Hero Card -->
  <section class="content-card crop-upload-card">
    <div class="card-header-flex">
      <div class="header-info">
        <div class="header-icon">
          <i class="fas fa-leaf"></i>
        </div>
        <div class="header-text">
          <h2 data-i18n="crop.title">Crop Detection & Diagnostics</h2>
          <p data-i18n="crop.subtitle">Upload crop leaf photography to detect diseases with on-device ONNX AI models.</p>
        </div>
      </div>
      <div class="header-badge-tag">
        <span class="badge badge-success"><i class="fas fa-microchip"></i> ONNX Neural Engine</span>
      </div>
    </div>

    <!-- Drag & Drop Zone -->
    <div class="crop-upload-grid" id="cropUploadBox">
      <input type="file" id="cropImageInput" accept="image/*" hidden>

      <!-- Left: Upload Controls -->
      <div class="crop-upload-action-col">
        <div class="upload-icon-circle">
          <i class="fas fa-cloud-arrow-up"></i>
        </div>
        <h3 data-i18n="crop.dragDrop">Drag & drop your crop image here</h3>
        <p class="upload-subtext">Supports PNG, JPG, WEBP up to 10MB</p>
        <div class="crop-btn-group">
          <button type="button" id="browseCropBtn" class="btn-primary">
            <i class="fas fa-folder-open"></i> <span data-i18n="crop.browseFile">Browse File</span>
          </button>
          <button type="button" id="cameraBtn" class="btn-secondary">
            <i class="fas fa-camera"></i> <span data-i18n="crop.openCamera">Camera</span>
          </button>
        </div>
        <span class="permission-note" data-i18n="crop.permissionNote">* If camera fails, allow access in your browser address bar.</span>
      </div>

      <!-- Right: Preview / Camera Viewport -->
      <div class="crop-preview-col">
        <div class="preview-header-row">
          <span class="preview-label">Live Preview</span>
          <button type="button" id="clearPreviewBtn" class="btn-ghost icon-only" title="Clear image" style="display: none;">
            <i class="fas fa-times"></i>
          </button>
        </div>
        <div class="crop-preview-viewport">
          <div id="previewEmptyState" class="empty-preview-content">
            <i class="far fa-image"></i>
            <span>No image selected yet</span>
          </div>
          <video id="cameraFeed" playsinline autoplay></video>
          <img id="cropPreview" class="crop-preview" alt="Selected crop preview" style="display: none;">
          <button type="button" id="captureBtn" class="camera-capture-trigger" style="display: none;">
            <i class="fas fa-circle-dot"></i> <span data-i18n="crop.capturePhoto">Capture Photo</span>
          </button>
        </div>
        <p id="cropFileName" class="crop-filename-tag"></p>
      </div>
    </div>

    <!-- Action Triggers -->
    <div class="crop-actions-bar">
      <button type="button" id="analyzeCropBtn" class="btn-primary analyze-submit-btn" disabled>
        <i class="fas fa-magnifying-glass"></i> <span data-i18n="crop.analyzeCrop">Analyze Crop</span>
      </button>
      <button type="button" id="newAnalyzeBtn" class="btn-secondary">
        <i class="fas fa-arrows-rotate"></i> <span data-i18n="crop.newAnalysis">New Analysis</span>
      </button>
    </div>
  </section>

  <!-- Diagnostic Result Card -->
  <section id="cropResult" class="content-card crop-result-card" style="display: none;">
    <div id="cropResultContent"></div>
  </section>
</div>
