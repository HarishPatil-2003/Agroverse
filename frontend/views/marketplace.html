<section class="marketplace-tools">
    <div style="display: flex; gap: 10px; width: 100%;">
        <div class="search-bar" style="flex: 1;">
            <i class="fas fa-search"></i>
            <input type="text" data-i18n-placeholder="marketplace.searchPlaceholder" placeholder="Search equipment (e.g., tractor, plow...)">
        </div>
        <button id="add-product-btn" class="action-btn" style="white-space: nowrap; padding: 0 20px; border-radius: 8px;">
            <i class="fas fa-plus"></i> Add Product
        </button>
    </div>
    <div class="filter-dropdowns">
        <div class="tool-dropdown"><span data-i18n="marketplace.category">Category</span> <i class="fas fa-chevron-down"></i></div>
        <div class="tool-dropdown"><span data-i18n="marketplace.condition">Condition</span> <i class="fas fa-chevron-down"></i></div>
        <div class="tool-dropdown"><span data-i18n="marketplace.location">Location</span> <i class="fas fa-chevron-down"></i></div>
        <div class="tool-dropdown"><span data-i18n="marketplace.sortBy">Sort By</span> <i class="fas fa-chevron-down"></i></div>
    </div>
</section>

<!-- Add Product Modal -->
<div id="add-product-modal" class="modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center;">
    <div class="modal-content" style="background: var(--surface); padding: 30px; border-radius: 12px; width: 90%; max-width: 500px; position: relative;">
        <button id="close-modal-btn" style="position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted);">&times;</button>
        <h2 style="margin-top: 0;">Add New Product</h2>
        <form id="add-product-form" style="display: flex; flex-direction: column; gap: 15px;">
            <div>
                <label style="display:block; margin-bottom:5px;">Product Name</label>
                <input type="text" id="prod-name" required style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px;">
            </div>
            <div style="display: flex; gap: 15px;">
                <div style="flex: 1;">
                    <label style="display:block; margin-bottom:5px;">Category</label>
                    <select id="prod-category" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px;">
                        <option>Tractors</option>
                        <option>Implements</option>
                        <option>Irrigation</option>
                        <option>Harvesting</option>
                        <option>Planting</option>
                        <option>Others</option>
                    </select>
                </div>
                <div style="flex: 1;">
                    <label style="display:block; margin-bottom:5px;">Condition</label>
                    <select id="prod-condition" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px;">
                        <option>New</option>
                        <option>Used - Like New</option>
                        <option>Used - Good</option>
                        <option>Used - Fair</option>
                    </select>
                </div>
            </div>
            <div style="display: flex; gap: 15px;">
                <div style="flex: 1;">
                    <label style="display:block; margin-bottom:5px;">Price (₹)</label>
                    <input type="number" id="prod-price" required style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px;">
                </div>
                <div style="flex: 1;">
                    <label style="display:block; margin-bottom:5px;">Location</label>
                    <input type="text" id="prod-location" required style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px;">
                </div>
            </div>
            <div>
                <label style="display:block; margin-bottom:5px;">Description</label>
                <textarea id="prod-desc" rows="3" style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px;"></textarea>
            </div>
            <button type="submit" class="action-btn" style="padding: 12px; font-size: 16px; margin-top: 10px; width: 100%;">List Product</button>
        </form>
    </div>
</div>

<nav class="category-chips">
    <button class="chip active">All</button>
    <button class="chip">Tractors</button>
    <button class="chip">Implements</button>
    <button class="chip">Irrigation</button>
    <button class="chip">Harvesting</button>
    <button class="chip">Planting</button>
    <button class="chip">Others</button>
</nav>

<section class="products-grid">
    <!-- Products will be loaded dynamically -->
</section>

        </div>

            <img src="https://images.unsplash.com/photo-1594911771120-7f2824388151?q=80&w=150&auto=format&fit=crop" alt="Tools">
            <div class="recent-info">
                <h4>Irrigation Kit (Small)</h4>
                <p class="recent-price">₹12,400</p>
            </div>
        </div>
        <div class="recent-card-small">
            <img src="https://images.unsplash.com/photo-1533240332313-0db49b459ad6?q=80&w=150&auto=format&fit=crop" alt="Trailer">
            <div class="recent-info">
                <h4>Heavy Duty Trailer</h4>
                <p class="recent-price">₹1,10,000</p>
            </div>
