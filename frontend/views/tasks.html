<div class="tasks-page-container" style="padding: 20px; max-width: 800px; margin: 0 auto;">
    <div style="display: flex; align-items: center; margin-bottom: 20px; gap: 15px;">
        <button class="action-btn" onclick="window.location.hash='#/home'" style="background: var(--surface); color: var(--text-main); border: 1px solid var(--border); border-radius: 8px; padding: 8px 15px; cursor: pointer;">
            <i class="fas fa-arrow-left"></i> Back to Home
        </button>
        <h2 style="margin: 0;">Today's Planner</h2>
    </div>

    <div class="card-panel">
        <div class="tasks-list" id="full-tasks-list">
            <div class="loading-container">
                <i class="fas fa-circle-notch fa-spin" style="font-size: 24px;"></i>
                <p>Loading your schedule...</p>
            </div>
        </div>
    </div>
</div>
