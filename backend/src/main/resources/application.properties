server.port=${PORT:${SERVER_PORT:8080}}
spring.application.name=agroverse-backend

# Security & CORS
agroverse.cors.allowed-origins=${AGROVERSE_CORS_ALLOWED_ORIGINS:http://localhost:3001,http://127.0.0.1:3001}
agroverse.jwt.secret=${JWT_SECRET:agroverse-production-secure-hmac-sha256-key-with-minimum-32-characters!}
agroverse.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Supabase Auth & JWKS Verification Configuration
agroverse.supabase.url=${SUPABASE_URL:https://ejqmibvsdyffohytfibl.supabase.co}
agroverse.supabase.jwks-url=${SUPABASE_JWKS_URL:${agroverse.supabase.url}/auth/v1/.well-known/jwks.json}
agroverse.supabase.jwt-issuer=${SUPABASE_JWT_ISSUER:${agroverse.supabase.url}/auth/v1}
agroverse.supabase.jwt-audience=${SUPABASE_JWT_AUDIENCE:authenticated}
agroverse.supabase.anon-key=${SUPABASE_ANON_KEY:sb_publishable_04rrULUKORwob7pqUuc8lw_aXBtvG4U}

# Servlet and Multipart configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JSON Configuration
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# Default DataSource (H2 In-Memory for local dev if PG is not provided)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:agroversedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Configuration (Enabled when explicitly configured or in production)
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=true

# AI Engine & External Services (Backend Only, secrets injected via environment)
agroverse.ai.groq.api-key=${GROQ_API_KEY:}
GROQ_API_KEY=${GROQ_API_KEY:}
agroverse.ai.groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
agroverse.ai.groq.timeout-ms=${GROQ_TIMEOUT_MS:10000}

agroverse.weather.api-key=${OPENWEATHER_API_KEY:}
openweather.api.key=${OPENWEATHER_API_KEY:}
agroverse.weather.timeout-ms=${WEATHER_TIMEOUT_MS:5000}

# Inference & Storage
krishi.onnx.confidence-threshold=${ONNX_CONFIDENCE_THRESHOLD:0.40}
krishi.uploads.dir=uploads

# Cache Refresh Configuration (15 minutes)
agroverse.cache.market-refresh-ms=900000
agroverse.cache.weather-refresh-ms=900000
